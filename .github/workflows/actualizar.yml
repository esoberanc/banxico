name: Actualizar indicadores Banxico

on:
  schedule:
    # Lunes a viernes 19:20 UTC = 13:20 hora de CDMX, cuando ya está publicado el FIX
    - cron: "20 19 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-banxico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Banxico y generar data.json
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/actualizar.py

      - name: Publicar si hay cambios
        run: |
          git config user.name "actualizador-banxico"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Indicadores Banxico $(date -u +%Y-%m-%d)"
            git push
          fi
